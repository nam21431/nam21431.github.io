<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Demonlist</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1a1a1a;
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #da3737;
        }
        header h1 {
            margin: 0;
            color: #da3737;
            font-size: 2.5rem;
        }
        .main-layout {
            display: flex;
            max-width: 1400px;
            margin: 30px auto;
            gap: 30px;
            padding: 0 20px;
        }
        /* Left sidebar level list */
        .sidebar {
            flex: 1;
            max-width: 450px;
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            height: 80vh;
            overflow-y: auto;
        }
        .list-item {
            background-color: #252525;
            margin-bottom: 15px;
            padding: 25px 20px;
            border-left: 6px solid #da3737;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .list-item:hover {
            background-color: #333;
            transform: scale(1.01);
        }
        .list-item h3 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            color: #fff;
        }
        .list-item p {
            margin: 0;
            color: #bbb;
            font-size: 1.05rem;
        }
        /* Right panel details view */
        .content-panel {
            flex: 2;
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 35px;
            height: fit-content;
        }
        .level-title {
            color: #da3737;
            margin-top: 0;
            font-size: 2.8rem;
        }
        .meta-info {
            color: #ccc;
            font-size: 1.2rem;
            margin-bottom: 25px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            line-height: 1.8; /* Adjusted for cleaner reading space */
        }
        /* Style for the level ID text highlight */
        .level-id {
            color: #58a6ff;
            font-weight: bold;
        }
        .video-container {
            margin: 30px 0;
            text-align: center;
        }
        .video-btn {
            display: inline-block;
            background-color: #da3737;
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .video-btn:hover {
            background-color: #ff4a4a;
        }
        .records-section h3 {
            border-bottom: 2px solid #da3737;
            padding-bottom: 8px;
            color: #da3737;
            font-size: 1.4rem;
        }
        .record-row {
            background-color: #222;
            padding: 15px 20px;
            margin: 8px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
        }
        .record-row span.percentage {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Official Demonlist</h1>
    </header>

    <div class="main-layout">
        <!-- Sidebar containing level names -->
        <div class="sidebar" id="sidebar-list"></div>

        <!-- Main panel displaying clicked level info -->
        <div class="content-panel" id="detail-panel">
            <p style="color: #aaa; font-size: 1.2rem;">Select a level from the list to view its details and records.</p>
        </div>
    </div>

    <script>
        // --- LEVEL AND RECORD DATA SOURCE WITH ID ADDED ---
        const demonData = [
            {
                rank: 1,
                name: "Tidal Wave",
                id: "94561578", // <-- Added ID here
                creator: "OniLink",
                verifier: "Trick",
                videoUrl: "https://youtube.com",
                records: [
                    { player: "Popo", percentage: "100%" },
                    { player: "Wnter", percentage: "100%" }
                ]
            },
            {
                rank: 2,
                name: "Acheron",
                id: "83344686", // <-- Added ID here
                creator: "Riot & More",
                verifier: "Zoink",
                videoUrl: "https://youtube.com",
                records: [
                    { player: "Trick", percentage: "100%" },
                    { player: "Mulpan", percentage: "84%" }
                ]
            },
            {
                rank: 3,
                name: "Silent Clubstep",
                id: "81804791", // <-- Added ID here
                creator: "Sailent",
                verifier: "Paqeo",
                videoUrl: "https://youtube.com",
                records: [
                    { player: "Zoink", percentage: "100%" }
                ]
            }
        ];

        const sidebar = document.getElementById('sidebar-list');
        const detailPanel = document.getElementById('detail-panel');

        // Render Sidebar Menu
        function initSidebar() {
            demonData.forEach(level => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <h3>#${level.rank} - ${level.name}</h3>
                    <p>By ${level.creator}</p>
                `;
                div.onclick = () => showLevelDetails(level);
                sidebar.appendChild(div);
            });
            
            // Automatically open #1 on first load
            if(demonData.length > 0) showLevelDetails(demonData[0]);
        }

        // Render Main View details dynamically
        function showLevelDetails(level) {
            let recordsHTML = '';
            if(level.records && level.records.length > 0) {
                level.records.forEach(rec => {
                    recordsHTML += `
                        <div class="record-row">
                            <span><strong>${rec.player}</strong></span>
                            <span class="percentage">${rec.percentage}</span>
                        </div>
                    `;
                });
            } else {
                recordsHTML = '<p style="color: #aaa;">No records established yet.</p>';
            }

            // Added Level ID line into the output template below
            detailPanel.innerHTML = `
                <h2 class="level-title">${level.name}</h2>
                <div class="meta-info">
                    <p><strong>Level ID:</strong> <span class="level-id">${level.id}</span></p>
                    <p><strong>Creator:</strong> ${level.creator}</p>
                    <p><strong>Verifier:</strong> ${level.verifier}</p>
                </div>
                <div class="video-container">
                    <a href="${level.videoUrl}" target="_blank" class="video-btn">Watch Verification Video</a>
                </div>
                <div class="records-section">
                    <h3>Progress Records</h3>
                    ${recordsHTML}
                </div>
            `;
        }

        initSidebar();
    </script>
</body>
</html>
