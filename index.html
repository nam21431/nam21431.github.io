<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Demonlist & Leaderboard</title>
    <style>
        body {
            background: linear-gradient(135deg, #eef2f7 0%, #dfe6e9 100%);
            color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ffffff;
            padding: 30px;
            text-align: center;
            border-bottom: 4px solid #4a90e2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        header h1 {
            margin: 0 0 15px 0;
            color: #000000;
            font-size: 2.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .nav-btn {
            background-color: #f1f2f6;
            border: 1px solid #dcdde1;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn.active, .nav-btn:hover {
            background-color: #4a90e2;
            color: #ffffff;
            border-color: #4a90e2;
        }
        .main-layout {
            display: flex;
            max-width: 1400px;
            margin: 40px auto;
            gap: 25px;
            padding: 0 20px;
        }
        .sidebar {
            flex: 1;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            height: 75vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #dcdde1;
        }
        .list-item {
            background-color: #f8f9fa;
            margin-bottom: 15px;
            padding: 22px 20px;
            border-left: 6px solid #4a90e2;
            border-radius: 8px;
            cursor: pointer;
            border-top: 1px solid #eef2f7;
            border-right: 1px solid #eef2f7;
            border-bottom: 1px solid #eef2f7;
            transition: all 0.2s ease;
        }
        .list-item:hover {
            background-color: #ebf3fc;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.15);
        }
        .list-item h3 {
            margin: 0 0 6px 0;
            font-size: 1.4rem;
            color: #000000;
        }
        .list-item p {
            margin: 0;
            color: #555555;
            font-size: 1rem;
        }
        .content-panel {
            flex: 2;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px;
            height: fit-content;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #dcdde1;
        }
        .level-title {
            color: #000000;
            margin-top: 0;
            font-size: 3rem;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 10px;
        }
        .meta-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .meta-box {
            background-color: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e4e7eb;
        }
        .meta-box strong {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            color: #666;
        }
        .meta-box span {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .video-container {
            margin: 35px 0;
            text-align: center;
        }
        .video-btn {
            display: inline-block;
            background: linear-gradient(135deg, #2f3640 0%, #000000 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }
        .video-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .records-section h3 {
            border-bottom: 3px solid #2ecc71;
            padding-bottom: 8px;
            color: #000000;
            font-size: 1.5rem;
            margin-top: 40px;
        }
        .record-row {
            background-color: #f5f6fa;
            padding: 18px 25px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #dcdde1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.15rem;
            color: #000000;
        }
        .record-row span.percentage {
            color: #ffffff;
            background-color: #2ecc71;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
        }
        /* Leaderboard Specific Styles */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #e1e4e8;
        }
        .leaderboard-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: #555;
        }
        .leaderboard-table tr:hover {
            background-color: #f8f9fa;
        }
        .rank-badge {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            color: white;
            background-color: #7f8c8d;
        }
        .rank-1 { background-color: #f1c40f; }
        .rank-2 { background-color: #bdc3c7; }
        .rank-3 { background-color: #e67e22; }
    </style>
</head>
<body>

    <header>
        <h1>mrroller level list</h1>
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchView('levels')">Level List</button>
            <button class="nav-btn" onclick="switchView('leaderboard')">Leaderboard</button>
        </div>
    </header>

    <div class="main-layout" id="layout-container">
        <!-- Sidebar containing level names (dynamically rendered) -->
        <div class="sidebar" id="sidebar-list"></div>

        <!-- Main panel displaying clicked level info or leaderboard -->
        <div class="content-panel" id="detail-panel">
            <p style="font-size: 1.2rem;">Select a level from the list to view its details and records.</p>
        </div>
    </div>

    <script>
        // --- LEVEL AND LEADERBOARD DATA SOURCE ---
        const demonData = [
            {
                rank: 1,
                name: "Stereo Madness",
                id: "None",
                creator: "Robtop",
                verifier: "mrroller",
                videoUrl: "https://youtube.com",
                records: [
                    { player: "socvinhtien", percentage: "100%" }
                ]
            },
            {
                rank: 2,
                name: "Back On Track",
                id: "None",
                creator: "Robtop",
                verifier: "mrroller",
                videoUrl: "https://youtube.com",
                records: [
                    { player: "None", percentage: "0%" }
                ]
            },
            {
                rank: 3,
                name: "Polargeist",
                id: "None",
                creator: "Robtop",
                verifier: "mrroller",
                videoUrl: "https://youtube.com",
                records: [
                    { player: "None", percentage: "0%" }
                ]
            }
        ];

        // Example Leaderboard Data (Calculated points or standalone stats)
        const leaderboardData = [
            { rank: 1, player: "mrroller", demonsCompleted: 1, score: 150 },
            { player: "socvinhtien", demonsCompleted: 0, score: 50 },
            { player: "PlayerTwo", demonsCompleted: 0, score: 0 },
        ];

        let currentView = 'levels';

        const sidebar = document.getElementById('sidebar-list');
        const detailPanel = document.getElementById('detail-panel');

        function switchView(view) {
            currentView = view;
            
            // Update button states
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(view === 'levels') {
                event.target.classList.add('active');
                sidebar.style.display = 'block';
                initSidebar();
            } else {
                event.target.classList.add('active');
                sidebar.style.display = 'none';
                showLeaderboard();
            }
        }

        // Render Sidebar Menu
        function initSidebar() {
            sidebar.innerHTML = '';
            demonData.forEach(level => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <h3>#${level.rank} - ${level.name}</h3>
                    <p>By ${level.creator}</p>
                `;
                div.onclick = () => showLevelDetails(level);
                sidebar.appendChild(div);
            });
            
            // Automatically open #1 on first load
            if(demonData.length > 0) showLevelDetails(demonData[0]);
        }

        // Render Main View details dynamically
        function showLevelDetails(level) {
            if(currentView !== 'levels') return;
            let recordsHTML = '';
            if(level.records && level.records.length > 0) {
                level.records.forEach(rec => {
                    recordsHTML += `
                        <div class="record-row">
                            <span><strong>${rec.player}</strong></span>
                            <span class="percentage">${rec.percentage}</span>
                        </div>
                    `;
                });
            } else {
                recordsHTML = '<p>No records established yet.</p>';
            }

            detailPanel.innerHTML = `
                <h2 class="level-title">${level.name}</h2>
                <div class="meta-container">
                    <div class="meta-box">
                        <strong>Level ID</strong>
                        <span>${level.id}</span>
                    </div>
                    <div class="meta-box">
                        <strong>Creator</strong>
                        <span>${level.creator}</span>
                    </div>
                    <div class="meta-box">
                        <strong>Verifier</strong>
                        <span>${level.verifier}</span>
                    </div>
                </div>
                <div class="video-container">
                    <a href="${level.videoUrl}" target="_blank" class="video-btn">Watch Verification Video</a>
                </div>
                <div class="records-section">
                    <h3>Progress Records</h3>
                    ${recordsHTML}
                </div>
            `;
        }

        // Render Leaderboard View
        function showLeaderboard() {
            // Sort leaderboard by score descending
            leaderboardData.sort((a, b) => b.score - a.score);

            let rowsHTML = '';
            leaderboardData.forEach((entry, index) => {
                const rankNum = index + 1;
                const badgeClass = rankNum <= 3 ? `rank-badge rank-${rankNum}` : `rank-badge`;
                rowsHTML += `
                    <tr>
                        <td><span class="${badgeClass}">${rankNum}</span></td>
                        <td><strong>${entry.player}</strong></td>
                        <td>${entry.demonsCompleted}</td>
                        <td><strong>${entry.score} pts</strong></td>
                    </tr>
                `;
            });

            detailPanel.style.flex = "1"; // Expand content panel when sidebar is hidden
            detailPanel.innerHTML = `
                <h2 class="level-title">Leaderboard</h2>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Demons Completed</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rowsHTML}
                    </tbody>
                </table>
            `;
        }

        initSidebar();
    </script>
</body>
</html>
